#   variables:
#     KUBERNETES_MEMORY_REQUEST: "10Gi"
#     NODE_OPTIONS: "--max-old-space-size=6144"
#   script:
#     - |
#       nice -n 15 ionice -c 3 bun run --cwd e2e-pw web:build
#       bun run --cwd e2e-pw web:start &
