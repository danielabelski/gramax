################ TEMPLATES ################

# Where the e2e suites get their catalogs. Nothing here is secret; `GX_E2E_GIT_TOKEN` is provided
# separately as a masked project- or group-level CI variable with `api` and `write_repository` scopes.
# `gx/test` holds the read-only fixture catalogs, `gx/test/temp` receives the throwaway repos a run
# creates; everything under it named `e2e-$GX_E2E_RUN_ID-*` is deleted by the Playwright teardown.
#
# The GX_E2E_GIT_ prefix is deliberately different from the older GX_E2E_GITLAB_ one: project-level
# CI variables outrank `variables:` declared here, so reusing the old names would silently keep the
# suites pointed at the external gitlab.com fixtures until someone deletes those settings.
.e2e-gitlab-env: &e2e-gitlab-env
  GX_E2E_GIT_HOST: gitlab.ics-it.ru
  GX_E2E_GIT_GROUP: gx/test
  GX_E2E_GIT_TEMP_GROUP: gx/test/temp
  GX_E2E_GIT_TEST_REPO: catalog
  GX_E2E_GIT_TEST_REPO_NO_INDEX: no-index-catalog
  # Per job, not per pipeline: the Playwright teardown deletes by this prefix, and the e2e jobs
  # run in parallel — a shared id lets a job that finishes early delete another one's live repos.
  GX_E2E_RUN_ID: $CI_PIPELINE_ID-$CI_JOB_ID

.template.e2e-pw:
  stage: test
  interruptible: true
  tags:
    - kubernetes01-gramax-5ghz
  needs:
    - job: tests
      optional: true
    - job: biome
      optional: true
    - job: tests-rust
      optional: true
  image: gitlab.ics-it.ru:4567/ics/doc-reader/playwright:$USE_IMAGE_TAG
  rules:
    - !reference [.rules, tests, base]
    - !reference [.rules, build, merge_request]
    - !reference [.rules, core]
    - changes:
        - e2e-pw/**/*
  variables:
    <<: *e2e-gitlab-env
    PRODUCTION: 'false'
    KUBERNETES_MEMORY_REQUEST: '2Gi'
    # Two workers and two cores, requested and capped at the same number, because the request is what
    # the scheduler believes and the limit is what the suite actually runs at. Asking for one while
    # running four browsers put two suites on the same node, and each ran about twice as slow as it
    # does alone — every wall-clock threshold in Playwright then fires on someone else's load.
    #
    # Matching the two closes what raising the request alone left open. A ceiling of five let a suite
    # that started on an empty node run at more than twice the speed of the same suite on a full one:
    # web-e2e-pw took 16 minutes in pipeline 597120 and 35 in 597201, both green, and the four reds
    # in between sit inside that spread rather than above it. A threshold cannot be set against a
    # machine that fast one hour and that slow the next, and the reds it produces name a different
    # test every time (join-lists, heading, delete column, move-nodes across 597107-597192), which is
    # what a starved render looks like rather than a broken suite.
    #
    # The trade is stated plainly: the fast runs go away with the slow ones. A suite settles near the
    # long end of what it used to span, and pays that every time, in exchange for a number that means
    # something — the red runs cost a full rerun anyway.
    KUBERNETES_CPU_REQUEST: '2'
    KUBERNETES_CPU_LIMIT: '2'
    PLAYWRIGHT_WORKERS: '2'
    CARGO_HOME: '$CI_PROJECT_DIR/.cargo'
  cache: !reference [.cargo-cache, cache]
  artifacts:
    when: on_failure
    expire_in: '2 days'
    paths:
      - e2e-pw/report
  before_script:
    - !reference [.template.github-ssh-key, before_script]
    - |
      HTTPS_PROXY=$RUNNER_HTTPS_PROXY ./install-deps.sh --ci
      npm rebuild better-sqlite3 --build-from-source
      npm rebuild canvas --build-from-source
      node -e "require('canvas').createCanvas(1, 1).getContext('2d')"
      node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.close();"

.template.enterprise:
  variables:
    NODE_TLS_REJECT_UNAUTHORIZED: 0
    ENTERPRISE_STORAGE_TYPE: local
    GIT_SERVER_TOKEN: $ENTERPRISE_GIT_SERVER_TOKEN
    GIT_PROJECT_PATH: $ENTERPRISE_GIT_PROJECT_PATH
    GES_URL: $ENTERPRISE_GES_URL
    KEYCLOAK_CLIENT_SECRET: $E2E_KEYCLOAK_CLIENT_SECRET
  before_script:
    - |
      source ./scripts/enterprise/test-local/enterprise.env
      export GES_URL
      export ALLOWED_GRAMAX_URLS
      export LICENSE_KEY
      export AUTH_METHOD
      export KEYCLOAK_SERVER_URL

      export E2E_KEYCLOAK_READER_MAIL
      export E2E_KEYCLOAK_REVIEWER_MAIL
      export E2E_KEYCLOAK_EDITOR_MAIL
      export E2E_KEYCLOAK_CATALOG_OWNER_MAIL
      export E2E_KEYCLOAK_WORKSPACE_OWNER_MAIL

    - echo '127.0.0.1 enterprise.gramax.local' >> /etc/hosts
    - ./scripts/enterprise/test-local/start-enterprise.sh &

.template.tests:
  interruptible: true
  stage: test
  image: gitlab.ics-it.ru:4567/ics/doc-reader/playwright:$USE_IMAGE_TAG
  tags:
    - kubernetes01-gramax-5ghz
  rules:
    - !reference [.rules, tests, base]
    - !reference [.rules, build, merge_request]
    - !reference [.rules, core]

  variables:
    CARGO_HOME: '$CI_PROJECT_DIR/.cargo'
    KUBERNETES_MEMORY_REQUEST: '1Gi'
    KUBERNETES_CPU_REQUEST: '1'
    KUBERNETES_CPU_LIMIT: '5'
  cache: !reference [.cargo-cache, cache]
  before_script:
    - !reference [.template.github-ssh-key, before_script]
    - |
      HTTPS_PROXY=$RUNNER_HTTPS_PROXY ./install-deps.sh --ci --node
      npm rebuild better-sqlite3 --build-from-source
      npm rebuild canvas --build-from-source
      node -e "require('canvas').createCanvas(1, 1).getContext('2d')"
      node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.close();"
  artifacts:
    reports:
      junit: junit.xml

.template.tests-enterprise:
  extends: .template.tests
  variables: !reference [.template.enterprise, variables]
  before_script:
    - !reference [.template.tests, before_script]
    - !reference [.template.enterprise, before_script]

.template.e2e-pw-enterprise:
  extends: .template.e2e-pw
  variables: !reference [.template.enterprise, variables]
  before_script:
    - !reference [.template.e2e-pw, before_script]
    - !reference [.template.enterprise, before_script]

################### JOBS ###################

plugins:
  stage: test
  interruptible: true
  image: gitlab.ics-it.ru:4567/ics/doc-reader/playwright:$USE_IMAGE_TAG
  tags:
    - kubernetes01-gramax-5ghz
  rules:
    - !reference [.rules, default-pipeline-guards]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH =~ /^(develop|release\/.*)$/'
      changes:
        - plugins/**/*
        - package.json
        - bun.lock
        - .ci/tests.yml
        - .ci/build.yml
  before_script:
    - !reference [.template.github-ssh-key, before_script]
    - HTTPS_PROXY=$RUNNER_HTTPS_PROXY ./install-deps.sh --ci --node
  script:
    - bun run --cwd plugins/sdk build
    - bun run --cwd plugins/sdk test:types
    - bun run --cwd plugins/sdk test:release
    - |
      for plugin in plugins/examples/*; do
        bun run --cwd "$plugin" build
      done

tests-rust:
  stage: test
  interruptible: true
  tags:
    - shell-macos-arm64v8
  rules:
    - !reference [.rules, tests, base]
    - !reference [.rules, tests, rust]
  script:
    - ./gx make-icons
    # `default-members` — gramax-git, gramax-fs, gramax-core, test-utils — instead of a per-crate
    # `-p` list. A crate added to `members` only is still not covered; today that includes `gramax`
    # itself, so `tests/print_to_pdf.rs` (apps/tauri/src-tauri) needs a manual `cargo test -p gramax`
    # run — see the comment on `macos_print_test_support`. `spa` is not a default member and stays its
    # own line.
    - cargo test --all-targets --tests --manifest-path ./Cargo.toml
    - cargo test --all-targets --tests -p spa --manifest-path ./Cargo.toml

biome:
  stage: test
  interruptible: true
  image: gitlab.ics-it.ru:4567/ics/doc-reader/base-image:$USE_IMAGE_TAG
  tags:
    - kubernetes01-gramax
  variables:
    GIT_DEPTH: 100
    KUBERNETES_MEMORY_REQUEST: '512Mi'
    KUBERNETES_CPU_REQUEST: '0.2'
    KUBERNETES_CPU_LIMIT: '3'
  rules:
    - if: '$CI_COMMIT_TITLE =~ /!?\[?(skip|no)[ -]biome\]?/i'
      when: never
    - !reference [.rules, tests, base]
    - !reference [.rules, build, merge_request]
    - !reference [.rules, core]
  before_script:
    - ./install-deps.sh --ci
  script:
    - |
      if [ -v CI_MERGE_REQUEST_TARGET_BRANCH_NAME ]; then
        . "$CI_PROJECT_DIR/.ci/scripts/retry.sh" && retry 3 2 -- git fetch --depth 100 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        bun run biome ci --no-errors-on-unmatched --error-on-warnings --files-ignore-unknown=true --changed --since=origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}
      fi
    - bun run biome ci --diagnostic-level error

trivy:
  extends: .template.tests
  stage: test
  tags:
    - kubernetes01-gramax
  image: ${NEXUS_DOCKERHUB}/aquasec/trivy:0.70.0
  rules:
    - !reference [.rules, tests, base]
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - '**/package.json'
        - '**/package-lock.json'
        - '**/bun.lock'
        - '**/Cargo.lock'
        - '**/Cargo.toml'
  before_script: []
  script:
    - trivy fs --config trivy.yaml . | tee trivy-report.txt
    - trivy fs --exit-code 1 --config trivy.yaml --severity CRITICAL . > /dev/null
  cache:
    key: trivy-cache
    paths:
      - .cache/trivy/**/*
  artifacts:
    when: always
    expire_in: '3 days'
    paths:
      - trivy-report.txt

tests:
  extends: .template.tests-enterprise
  variables:
    KUBERNETES_CPU_REQUEST: '1'
    KUBERNETES_CPU_LIMIT: '5'
    KUBERNETES_MEMORY_REQUEST: '4Gi'
  script:
    - bun run tsc --incremental false
    - bun run test:unit
    - bun run test:int
    # - bun run test:db Commented because @testcontainers/postgresql lib to run test db need NodeJS >= 22.19.0. Now CI use NodeJS 20
    # - bun run test:ges

web-e2e-pw:
  extends: .template.e2e-pw
  # Runs the stash suite alongside the rest: what it watches is a user's unpublished work, and those
  # failures are the ones nobody notices until the change is already gone. It drives a real
  # repository, hence the larger budget.
  variables:
    CI_JOB_MAX_DURATION: '3600'
    KUBERNETES_MEMORY_REQUEST: '4Gi'
    # The template's 2/2 is what the "reds name a different test every time" comment above it warns
    # about: this suite builds the app, runs a real browser and drives a real GitLab repo, so it is
    # the one most exposed to a node it shares with another job. A third core buys it headroom the
    # rest of the suite doesn't need.
    KUBERNETES_CPU_REQUEST: '3'
    KUBERNETES_CPU_LIMIT: '3'
    # A test that only passed on its second try still means the runner starved it once — worth
    # knowing, not worth reddening 470 tests over. See playwright.config.ts's own comment on this flag.
    PLAYWRIGHT_ALLOW_FLAKY: 'true'
  script:
    - |
      nice -n 15 ionice -c 3 bun run --cwd e2e-pw web:build
      bun run --cwd e2e-pw web:start &
    - nice -n -15 bun run --cwd e2e-pw web:ci
  # What the measured commands actually cost this time, in the log even when the suite went red — a
  # budget nobody can read the numbers behind is a number nobody can raise on purpose.
  after_script:
    - bun run --cwd e2e-pw timings || true

