static-e2e-pw:
  extends: .template.e2e-pw
  variables:
    PORT: 6002
  script:
    - rm -rf services && cd apps/cli
    - . "$CI_PROJECT_DIR/.ci/scripts/retry.sh" && retry 3 2 -- git clone https://git:$GX_E2E_GIT_TOKEN@$GX_E2E_GIT_HOST/$GX_E2E_GIT_GROUP/$GX_E2E_GIT_TEST_REPO.git
    - nice -n 20 ionice -c 3 bun run build
    - nice -n 20 ionice -c 3 bun run dist/index.js build -s "$GX_E2E_GIT_TEST_REPO" --skip-check
    - n use 20
    - nice -n 20 ionice -c 2 -n 3 npx ./dist build -s "$GX_E2E_GIT_TEST_REPO" --skip-check

next-e2e-pw:
  extends: .template.e2e-pw
  variables:
    PORT: 6003
    ADMIN_PASSWORD: 1
    ADMIN_LOGIN: 1
  script:
    - rm -rf services
    - nice -n 10 ionice -c 3 bun run --cwd e2e-pw next:build-git
    - nice -n 10 ionice -c 3 bun run --cwd e2e-pw next:build
    - bun run --cwd e2e-pw next:start &
    - nice -n -15 ionice -c 2 bun run --cwd e2e-pw next:ci

docportal-e2e-pw:
  extends: .template.e2e-pw
  variables:
    PORT: 6004
    ADMIN_PASSWORD: 1
    ADMIN_LOGIN: 1
  script:
    - rm -rf services
    - nice -n 10 ionice -c 3 bun run --cwd e2e-pw docportal:build-git
    - nice -n 10 ionice -c 3 bun run --cwd e2e-pw docportal:build
    - bun run --cwd e2e-pw docportal:start &
    - until curl -s --max-time 5 -o /dev/null http://127.0.0.1:6004/ 2>/dev/null; do sleep 1; done
    - nice -n -15 ionice -c 2 bun run --cwd e2e-pw docportal:ci

web-e2e-pw-timings:
  extends: .template.e2e-pw
  # Never on its own, and nowhere but a merge request. The measuring cases cost far more than a
  # pipeline should spend unasked, so they wait for someone to press this — which is also when their
  # numbers are worth anything, since they are read against the change under review.
  rules:
    - !reference [.rules, default-pipeline-guards]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - when: never
  variables:
    <<: *e2e-gitlab-env
    CI_JOB_MAX_DURATION: '3600'
    KUBERNETES_MEMORY_REQUEST: '4Gi'
    # The catalog the measured commands run against: a snapshot of the real board, 3446 files, kept
    # read-only and forked per run. Same data every time, which is what makes a budget mean anything.
    # Set here and nowhere else: `command-measure` judges its budgets only against this fixture, and
    # this is the one job quiet enough for a wall-clock budget to mean what it says.
    GX_E2E_CMD_FIXTURE: gx/test/perf-board
  artifacts:
    # Unlike the gating suites this one is run for its numbers, so the timings come back either way.
    when: always
    expire_in: '7 days'
    paths:
      - e2e-pw/report
      - e2e-pw/timings
  script:
    - |
      nice -n 15 ionice -c 3 bun run --cwd e2e-pw web:build
      bun run --cwd e2e-pw web:start &
    - nice -n -15 bun run --cwd e2e-pw web:timings:ci
  # In the log even when the suite went red: a case that failed still took the time it took, and
  # that number is half of why this job exists.
  after_script:
    - bun run --cwd e2e-pw timings || true

e2e-temp-cleanup:
  stage: test
  # Not interruptible: a half-cancelled cleanup leaves the group in the state it was meant to fix.
  tags:
    - kubernetes01-gramax
  image: gitlab.ics-it.ru:4567/ics/doc-reader/base-image:$USE_IMAGE_TAG
  # Scheduled runs only, and only the schedule that sets E2E_CLEANUP — without that variable every
  # schedule would drag the whole pipeline along.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $E2E_CLEANUP == "true"
  variables:
    <<: *e2e-gitlab-env
    GIT_DEPTH: 1
  script:
    - ./.ci/e2e/delete-repos.ts

scan-containers:
  extends: container_scanning
  interruptible: true
  tags:
    - kubernetes01-gramax
  rules: !reference [.rules, build, if-release]
  variables:
    GIT_STRATEGY: fetch
  parallel:
    matrix:
      - CS_IMAGE: 'docker.io/gramax/docportal'
        CS_DOCKERFILE_PATH: ./apps/next/next.Dockerfile
      - CS_IMAGE: 'docker.io/gramax/editor'
        CS_DOCKERFILE_PATH: ./apps/web/Dockerfile

detect-secrets:
  extends: secret_detection
  interruptible: true
  tags:
    - kubernetes01-gramax
  rules:
    - !reference [.rules, tests, base]
    - !reference [.rules, build, merge_request]
    - !reference [.rules, core]

container_scanning:
  rules:
    - when: never

secret_detection:
  rules:
    - when: never
