"$schema" = "schemas/schema.json"

# Every command the plugin exposes, allowed as one permission.
#
# The list used to be one `allow-<command>` line per command, each pointing at a permission
# `build.rs` generates. Adding a command there and forgetting it here left it denied at runtime with
# nothing in the build to say so — the desktop app simply could not call it. The names below are the
# ones in `COMMANDS` in `build.rs`, and `build.rs` fails the build when the two lists disagree.
#
# There is nothing to gate per command: the plugin has exactly one caller, the Gramax frontend, and
# it calls all of it.
[[permission]]
identifier = "allow-all-commands"
description = "Allows every command the plugin exposes."
commands.allow = [
  "getstat",
  "write_file",
  "read_dir",
  "read_link",
  "make_dir",
  "remove_dir",
  "rmfile",
  "mv",
  "hardlink",
  "stat",
  "exists",
  "copy",
  "read_dir_stats",
  "delete_empty_dirs",
  "init_new",
  "clone",
  "cancel",
  "recover",
  "file_history",
  "checkout",
  "fetch",
  "stash",
  "stash_apply",
  "stash_restore",
  "stash_list",
  "push",
  "add",
  "status",
  "status_file",
  "branch_info",
  "new_branch",
  "stash_delete",
  "delete_branch",
  "get_remote",
  "branch_list",
  "diff",
  "add_remote",
  "has_remotes",
  "reset",
  "commit",
  "merge",
  "restore",
  "get_parent",
  "get_content",
  "count_changed_files",
  "get_commit_info",
  "find_refs_by_globs",
  "is_init",
  "is_bare",
  "set_head",
  "default_branch",
  "git_read_dir",
  "git_file_stat",
  "git_file_exists",
  "git_read_dir_stats",
  "list_merge_requests",
  "create_or_update_merge_request",
  "get_draft_merge_request",
  "get_commit_authors",
  "get_commit_range",
  "pull_lfs_objects",
  "gc",
  "get_all_cancel_tokens",
  "reset_repo",
  "reset_file_lock",
  "format_merge_message",
  "get_config_val",
  "set_config_val",
  "storage_stats",
  "lfs_prune",
  "healthcheck",
  "scan_workspace",
  "scan_catalog",
  "watch_workspace",
  "unwatch_workspace",
  "has_merge_conflicts",
]

[default]
description = "Allows every command the plugin exposes."
permissions = ["allow-all-commands"]
