    ```

    Для проверки выполнения передайте `sagaId` в метод проверки. В ответ вернётся CSV-файл
    с заполненными данными и ошибками, возникшими при выполнении операции. При получении списка
    выполняемых и выполненных заданий в ответе будет количество успешно обработанных строк,
    обработанных с ошибкой и оставшихся к обработке. Общее количество строк в файле равно
    сумме всех трёх значений.

