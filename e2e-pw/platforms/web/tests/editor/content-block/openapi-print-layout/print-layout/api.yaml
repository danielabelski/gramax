openapi: 3.1.0
info:
  title: Массовый импорт конфигураций
  version: '1.0'
  description: |
    # Особенности API

    Оркестратор позволяет создавать данные на Платформе на основании заранее подготовленных
    конфигурационных файлов. Конфигурационные файлы имеют формат **`.csv`** (разделитель — `;`)
    и используются для массовых операций:

    - регистрация **устройства**;
    - создание **L3-интерфейсов (Network)**;
    - создание **правил МСЭ**.

    ## Аутентификация

    Аутентификация производится через стандартный механизм входа на Платформу — **p12-сертификат**
    плюс **имя учётной записи**. Сертификат должен быть выпущен удостоверяющим центром Платформы
    и содержать расширение, разрешающее клиентскую аутентификацию.

    ## Авторизация

    Авторизация осуществляется согласно ролевой модели доступа. Для интеграции существуют отдельные
    доступы, позволяющие только **создавать** соответствующие сущности; чтение и удаление в рамках
    этого API не поддерживаются.

    ## Файлы

    Поддерживаются следующие типы CSV-файлов (разделитель — `;`):

    - `cpes_input.csv` — пакетная регистрация устройств;
    - `networks_input.csv` — пакетное создание L3-интерфейсов;
    - `rules_input.csv` — пакетное создание правил МСЭ.

    ## Проверка выполнения

    При вызове функций создания и регистрации в ответ возвращается идентификатор операции:

    ```json
    { "sagaId": 123456 }
    ```

    Полный ответ метода проверки — по строке на каждую запись файла:

    ```json
