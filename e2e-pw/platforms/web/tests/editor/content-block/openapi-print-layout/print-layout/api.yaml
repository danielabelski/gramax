servers:
  - url: https://example.org/api
    description: Продуктив
  - url: https://stage.example.org/api
    description: Тестовый контур
paths:
  /cpes:
    post:
      summary: Массовая регистрация устройств
      operationId: CPES_FILE_ADD
      responses:
        '200':
          description: Операция запланирована
  /networks:
    post:
      summary: Массовое создание L3-интерфейсов
      operationId: NETWORKS_FILE_ADD
      responses:
        '200':
          description: Операция запланирована
  /rules:
    post:
      summary: Массовое создание правил МСЭ
      operationId: RULES_FILE_ADD
      responses:
        '200':
          description: Операция запланирована
  /saga/{sagaId}:
    get:
      summary: Проверка выполнения операции
      operationId: SAGA_CHECK
      responses:
        '200':
          description: Результат выполнения
          content:
            application/json:
              example:
                sagaId: 123456
                done: 31
                failed: 1
