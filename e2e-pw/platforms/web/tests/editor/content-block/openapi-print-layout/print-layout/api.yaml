      "sagaId": 123456,
      "row1": { "cpe": "bankomat-ce20n-HUB-1", "status": "queued" },
      "row2": { "cpe": "bankomat-ce20n-HUB-2", "status": "queued" },
      "row3": { "cpe": "bankomat-ce20n-HUB-3", "status": "queued" },
